# Naziv workflow-a (videće se u GitHub Actions)
name: Backend CI-CD

# Kada se pokreće
on:
  push:
    branches: ["main"]        # svaki push na main
  pull_request:
    branches: ["main"]        # svaki PR ka main

# Dozvole za čitanje koda i push Docker image-a u GHCR
permissions:
  contents: read
  packages: write

# Ako pushuješ više puta brzo → prekida stare run-ove
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # =========================
  # 1. BACKEND TESTOVI
  # =========================
  backend-tests:
    name: Backend - Laravel tests
    runs-on: ubuntu-latest

    # Pokreće MySQL servis za test bazu
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: app_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        # Folder gde je Laravel projekat (promeni ako treba)
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Instalira PHP i potrebne ekstenzije
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql
          coverage: none

      # Cache za composer → brži build
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: |
            backend/vendor
            ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Priprema .env i generiše APP_KEY
      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      # Pokreće migracije za test bazu
      - name: Run migrations
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: app_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      # Pokreće PHPUnit / Laravel testove
      - name: Run tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: app_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test


  # =========================
  # 2. DOCKER BUILD
  # =========================
  docker-build-and-push-backend:
    name: Build & Push backend Docker image
    runs-on: ubuntu-latest

    # Pokreće se samo ako testovi prođu
    needs: [backend-tests]

    # Radi samo na push na main (ne na PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login u GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build i push Docker image-a
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kalendar-backend:latest
            ghcr.io/${{ github.repository_owner }}/kalendar-backend:${{ github.sha }}