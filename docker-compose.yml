services:
  db:
    image: mysql:8.0
    container_name: kalendar_db
    environment:
      MYSQL_DATABASE: kalendar
      MYSQL_USER: kalendar
      MYSQL_PASSWORD: kalendar
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./bekend
      dockerfile: Dockerfile
    container_name: kalendar_backend
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./bekend:/var/www
    networks:
      - appnet

  backend_nginx:
    image: nginx:alpine
    container_name: kalendar_backend_nginx
    depends_on:
      - backend
    ports:
      - "8087:80"
    volumes:
      - ./bekend:/var/www
      - ./bekend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - appnet

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: kalendar_frontend
    depends_on:
      - backend_nginx
    ports:
      - "3007:80"
    networks:
      - appnet

volumes:
  db_data:

networks:
  appnet:
    driver: bridge